name: Bug report
description: Report a broken badge or site adapter (do not include chat content).
title: '[Bug]: '
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Do not share prompts, assistant responses, screenshots of chats, or other private conversation content.
  - type: dropdown
    id: site
    attributes:
      label: Affected site
      options:
        - Claude
        - Gemini
        - Other
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and version
      placeholder: Chrome 130 / Firefox 133
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: What happened?
      description: Describe the issue without including any chat text.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: false
