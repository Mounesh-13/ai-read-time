name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.5
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm test:coverage
      - name: Build Chrome and Firefox packages
        run: |
          pnpm wxt zip -b chrome
          pnpm wxt zip -b firefox
          ls -la .output/
      - uses: actions/upload-artifact@v4
        with:
          name: extension-builds
          path: |
            .output/ai-read-time-indicator-0.1.0-chrome.zip
            .output/ai-read-time-indicator-0.1.0-firefox.zip
            .output/ai-read-time-indicator-0.1.0-sources.zip
          if-no-files-found: error
          retention-days: 14
