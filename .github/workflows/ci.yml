name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.5
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm test:coverage
      - name: Build Chrome and Firefox packages
        run: |
          pnpm wxt zip -b chrome
          pnpm wxt zip -b firefox
          cp .output/*-chrome.zip .output/extension-chrome.zip
          cp .output/*-firefox.zip .output/extension-firefox.zip
          cp .output/*-sources.zip .output/extension-sources.zip
          ls -la .output/
      - uses: actions/upload-artifact@v4
        with:
          name: extension-builds
          path: |
            .output/extension-chrome.zip
            .output/extension-firefox.zip
            .output/extension-sources.zip
          if-no-files-found: error
          retention-days: 14
